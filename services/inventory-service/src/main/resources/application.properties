spring.application.name=inventory-service
server.port=8080
spring.mvc.problemdetails.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Enable explicitly for local documentation sessions; disabled by default.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persistAuthorization=false
springdoc.swagger-ui.validatorUrl=
springdoc.paths-to-match=/api/inventory/**

# Enable operations explicitly; JWT permissions apply whenever enabled.
inventory.operations.enabled=${INVENTORY_OPERATIONS_ENABLED:false}


# Inventory accepts dedicated RS256 access tokens, not the Order API HS256 user tokens.
inventory.jwt.public-key-base64=${INVENTORY_JWT_PUBLIC_KEY_BASE64:}
inventory.jwt.issuer=${INVENTORY_JWT_ISSUER:Inventory.LocalIssuer}
inventory.jwt.audience=${INVENTORY_JWT_AUDIENCE:Inventory.API}

# Provider trust is explicit; the existing local mode remains the development default.
inventory.jwt.mode=${INVENTORY_JWT_MODE:LocalRsa}
inventory.jwt.jwk-set-uri=${INVENTORY_JWT_JWK_SET_URI:}
inventory.jwt.allowed-client-ids=${INVENTORY_JWT_ALLOWED_CLIENT_IDS:}
inventory.jwt.reservation-scope=${INVENTORY_JWT_RESERVATION_SCOPE:inventory.reserve}
inventory.jwt.stock-scope=${INVENTORY_JWT_STOCK_SCOPE:inventory.stock.write}

# Health probes are the only exposed management endpoints; no connection details are returned.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.liveness.include=livenessState
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
