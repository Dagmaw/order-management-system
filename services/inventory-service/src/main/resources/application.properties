spring.application.name=inventory-service
server.port=8080
spring.mvc.problemdetails.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Enable explicitly for local documentation sessions; disabled by default.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:false}
springdoc.swagger-ui.persistAuthorization=false
springdoc.swagger-ui.validatorUrl=
springdoc.paths-to-match=/api/inventory/**

# Enable operations explicitly; JWT permissions apply whenever enabled.
inventory.operations.enabled=${INVENTORY_OPERATIONS_ENABLED:false}


# Inventory accepts dedicated RS256 access tokens, not the Order API HS256 user tokens.
inventory.jwt.public-key-base64=${INVENTORY_JWT_PUBLIC_KEY_BASE64:}
inventory.jwt.issuer=${INVENTORY_JWT_ISSUER:Inventory.LocalIssuer}
inventory.jwt.audience=${INVENTORY_JWT_AUDIENCE:Inventory.API}
