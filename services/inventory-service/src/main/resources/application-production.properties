# Production fails closed unless the issuer, audience, JWKS URL and client allowlist are configured.
inventory.jwt.mode=${INVENTORY_JWT_MODE:Jwks}

# ECS supplies the private database hostname and an RDS CA path in this URL.
spring.datasource.url=${INVENTORY_DATABASE_URL}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=5000
spring.flyway.connect-retries=5
