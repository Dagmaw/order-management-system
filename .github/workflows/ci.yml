name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
    dotnet:
        name: .NET - Build and Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
         - name: Ckeck out repository
           uses: actions/checkout@v7
         - name: Set up .NET SDK
           uses: actions/setup-dotnet@v6
           with:
            global-json-file: global.json
         - name: Show .NET SDK information
           run: dotnet --info
         - name: Restore dependencies
           run: dotnet restore OrderManagementSystem.sln   
         - name: Build solution
           run: dotnet build OrderManagementSystem.sln --configuration Release --no-restore
         - name: Run .NETtests
           run: dotnet test OrderManagementSystem.sln --configuration Release --no-build --verbosity normal

    inventory:
        name: Java - Build and Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
          run: 
            working-directory: services/inventory-service
        
        steps:
        - name: Ckeck out repository
          uses: actions/checkout@v7

        - name: Set up JDK 25
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: 25
            cache: maven
            cache-dependency-path: services/inventory-service/pom.xml   

        - name: Normalize maven Wrapper line endings
          run: sed -i 's/\r$//' mvnw
            
        - name: Show Java and Maven versions
          run: | 
                java -version
                sh ./mvnw --version

        - name: Build and run Java tests
          run: sh ./mvnw --batch-mode --no-transfer-progress clean verify