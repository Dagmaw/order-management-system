name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
    dotnet:
        name: .NET - Build and Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        steps:
         - name: Ckeck out repository
           uses: actions/checkout@v7
         - name: Set up .NET SDK
           uses: actions/setup-dotnet@v6
           with:
            global-json-file: global.json
         - name: Show .NET SDK information
           run: dotnet --info
         - name: Restore dependencies
           run: dotnet restore OrderManagementSystem.sln   
         - name: Build solution
           run: dotnet build OrderManagementSystem.sln --configuration Release --no-restore
         - name: Run .NETtests
           run: dotnet test OrderManagementSystem.sln --configuration Release --no-build --verbosity normal

    inventory:
        name: Java - Build and Test
        runs-on: ubuntu-24.04
        timeout-minutes: 15

        defaults:
          run: 
            working-directory: services/inventory-service
        
        steps:
        - name: Ckeck out repository
          uses: actions/checkout@v7

        - name: Set up JDK 25
          uses: actions/setup-java@v6
          with:
            distribution: temurin
            java-version: 25
            cache: maven
            cache-dependency-path: services/inventory-service/pom.xml   

        - name: Normalize maven Wrapper line endings
          run: sed -i 's/\r$//' mvnw
            
        - name: Show Java and Maven versions
          run: | 
                java -version
                sh ./mvnw --version

        - name: Build and run Java tests
          run: sh ./mvnw --batch-mode --no-transfer-progress clean verify
    
    e2e:
        name: .NET and Java - Integration and Recovery
        runs-on: ubuntu-24.04
        timeout-minutes: 25
        steps:
          - name: Check out repository
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false
          - name: Verify Inventory database bootstrap over TLS
            run: python3 scripts/test-inventory-bootstrap.py
          - name: Run isolated PostgreSQL integration checks
            run: python3 scripts/e2e-orders.py
          - name: Upload sanitized test results
            if: always()
            uses: actions/upload-artifact@v7.0.2
            with:
              name: integration-results
              path: artifacts/e2e-results.json
              if-no-files-found: warn

    publish-api:
        name: Publish API image to ECR
        needs: [dotnet, inventory, e2e]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-24.04
        timeout-minutes: 20

        permissions:
          contents: read
          id-token: write

        concurrency:
          group: publish-api-${{ github.sha }}
          cancel-in-progress: false

        steps:
          - name: Check out the tested commit
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false

          - name: Assume the ECR publishing role
            uses: aws-actions/configure-aws-credentials@v6.3.0
            with:
              role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
              aws-region: ${{ vars.AWS_REGION }}

          - name: Sign Docker in to Amazon ECR
            id: ecr
            uses: aws-actions/amazon-ecr-login@v2.1.7

          - name: Build and publish the API image
            shell: bash
            env:
              REGISTRY: ${{ steps.ecr.outputs.registry }}
              REPOSITORY: ${{ vars.ECR_REPOSITORY }}
            run: |
              set -euo pipefail

              image="${REGISTRY}/${REPOSITORY}"
              tag="$GITHUB_SHA"

              lookup_image() {
                aws ecr batch-get-image \
                  --repository-name "$REPOSITORY" \
                  --image-ids "imageTag=$tag" \
                  --output json
              }

              result="$(lookup_image)"
              digest="$(jq -r '.images[0].imageId.imageDigest // empty' <<< "$result")"

              if [[ -z "$digest" ]]; then
                jq -e '(.failures | length) == 1 and .failures[0].failureCode == "ImageNotFound"' \
                  <<< "$result" >/dev/null

                docker build \
                  --platform linux/amd64 \
                  --file src/OrderManagement.API/Dockerfile \
                  --tag "${image}:${tag}" \
                  .

                docker push "${image}:${tag}"

                result="$(lookup_image)"
                digest="$(jq -r '.images[0].imageId.imageDigest // empty' <<< "$result")"
              fi

              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]

              {
                printf '### Published API image\n\n'
                printf -- '- Commit tag: `%s:%s`\n' "$image" "$tag"
                printf -- '- ECS image: `%s@%s`\n' "$image" "$digest"
              } >> "$GITHUB_STEP_SUMMARY"
