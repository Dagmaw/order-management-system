name: Initialize Inventory Database Secret
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: initialize-inventory-database-secret
  cancel-in-progress: false
jobs:
  initialize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: terraform-dev
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::638500336727:role/order-management-dev-inventory-secret-init
          aws-region: us-east-1
      - name: Initialize only an empty dedicated secret
        shell: python
        run: |
          import json, secrets, subprocess
          secret_id = 'order-management/dev/inventory-database'
          def aws(*args, value=None):
              r = subprocess.run(['aws','secretsmanager',*args,'--region','us-east-1','--output','json','--no-cli-pager'], input=value, text=True, capture_output=True)
              if r.returncode:
                  raise SystemExit('Inventory secret initialization failed; inspect IAM and resource existence.')
              return json.loads(r.stdout)
          metadata = aws('describe-secret','--secret-id',secret_id)
          if any('AWSCURRENT' in stages for stages in metadata.get('VersionIdsToStages', {}).values()):
              print('Inventory secret already initialized; credentials were not rotated.')
          else:
              payload = json.dumps({'username':'inventory_app','password':secrets.token_urlsafe(36)})
              aws('put-secret-value','--secret-id',secret_id,'--secret-string','file:///dev/stdin',value=payload)
              print('Dedicated Inventory credentials initialized. Database bootstrap remains a separate step.')
