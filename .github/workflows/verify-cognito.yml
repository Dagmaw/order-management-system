name: Verify Cognito Service Identity

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-cognito-dev
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: terraform-dev
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Assume secret-read-only verification role
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::638500336727:role/order-management-dev-service-identity-test
          aws-region: us-east-1
      - name: Verify real Cognito tokens with disposable application databases
        run: python3 scripts/verify-cognito.py
      - name: Upload sanitized verification results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: cognito-integration-results
          path: artifacts/e2e-results.json
          if-no-files-found: warn
