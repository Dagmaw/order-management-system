name: Generate Terraform Provider Lock File

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-lock:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Check out main
        uses: actions/checkout@v7.0.1

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: '1.17.2'
          terraform_wrapper: false

      - name: Format, lock, and validate
        working-directory: infra/aws/dev
        run: |
          terraform fmt
          terraform providers lock -platform=linux_amd64 -platform=windows_amd64
          terraform init -backend=false -input=false -lockfile=readonly
          terraform validate

      - name: Push changes to a review branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- infra/aws/dev/main.tf infra/aws/dev/.terraform.lock.hcl

          if git diff --cached --quiet; then
            echo "The Terraform configuration and lock file are already up to date."
            exit 0
          fi

          branch="automation/terraform-lock-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update Terraform provider lock file"
          git push origin "HEAD:refs/heads/$branch"

          printf '[Open a pull request](%s/%s/compare/main...%s?expand=1)\n' \
            "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$branch" >> "$GITHUB_STEP_SUMMARY"