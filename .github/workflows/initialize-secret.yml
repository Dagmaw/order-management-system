name: Initialize Secret

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: init-secret-dev
  cancel-in-progress: false

jobs:
  init:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: terraform-dev
    timeout-minutes: 5

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Sign in
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DB_MIGRATION_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Initialize application secret
        shell: python
        env:
          AWS_PAGER: ""
        run: |
          import json
          import os
          import subprocess

          secret_id = "order-management/dev/database"

          def aws(*args, value=None):
              result = subprocess.run(
                  [
                      "aws", "secretsmanager", *args,
                      "--output", "json", "--no-cli-pager"
                  ],
                  input=value,
                  text=True,
                  capture_output=True
              )
              if result.returncode:
                  raise SystemExit(
                      f"AWS operation {args[0]} failed."
                  )
              return json.loads(result.stdout)

          metadata = aws(
              "describe-secret",
              "--secret-id", secret_id
          )

          versions = metadata.get("VersionIdsToStages", {})

          if any("AWSCURRENT" in stages for stages in versions.values()):
              print("Secret already exists; leaving it unchanged.")
          elif versions:
              raise SystemExit("Unexpected versions; review required.")
          else:
              password = aws(
                  "get-random-password",
                  "--password-length", "40",
                  "--exclude-punctuation",
                  "--require-each-included-type"
              )

              aws(
                  "put-secret-value",
                  "--secret-id", secret_id,
                  "--secret-string", "file:///dev/stdin",
                  value=json.dumps({
                      "username": "order_app",
                      "password": password["RandomPassword"]
                  })
              )

              print("Secret initialized.")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("Application secret initialized.\n")